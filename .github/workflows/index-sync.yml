name: Global Indexing Engine

on:
  repository_dispatch:
    types: [shard_update]
  workflow_dispatch: 

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Master Index
        uses: actions/checkout@v4

      - name: Update SQLite Database
        env:
          SHARD_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          # Create data directory if it doesn't exist
          mkdir -p data
          python3 .github/scripts/update_registry.py "$SHARD_PAYLOAD"

      - name: Auto-Commit Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "Vijayagandi"
          git config user.email "vijayagandi@users.noreply.github.com"
          
          # 1. Stage the changes first
          git add data/registry.db
          
          # 2. Stash them temporarily so the pull is clean
          git stash
          
          # 3. Set the remote with the token
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          
          # 4. Pull the latest code
          git pull --rebase origin main
          
          # 5. Bring the database changes back
          git stash pop || echo "No changes to pop"
          
          # 6. Commit and Push
          git add data/registry.db
          git commit -m "sync: updated index for part" || echo "No changes to commit"
          git push origin main
