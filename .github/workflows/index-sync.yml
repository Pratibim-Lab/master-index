name: Global Indexing Engine

on:
  repository_dispatch:
    types: [shard_update]
  workflow_dispatch: 

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Master Index
        uses: actions/checkout@v4

      - name: Update SQLite Database
        env:
          SHARD_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          # Create data directory if it doesn't exist
          mkdir -p data
          python3 .github/scripts/update_registry.py "$SHARD_PAYLOAD"

      - name: Auto-Commit Changes
        env:
          # Use your secret token for the push
          GITHUB_TOKEN: ${{ secrets.GH_PAT }} 
        run: |
          git config user.name "Vijayagandi"
          git config user.email "vijayagandi@users.noreply.github.com"
          git add data/registry.db
          # The trick: add the token to the remote URL
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git pull --rebase origin main
          git commit -m "sync: updated index for manual test" || echo "No changes to commit"
          git push origin main
